name: Test Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [proton-cachyos, proton-cachyos-v3, dw-proton]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Build and inspect package
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          output=$(nix build ".#$PACKAGE" --no-link --print-out-paths --no-write-lock-file --option allow-import-from-derivation false)
          bash scripts/check-package.sh "$PACKAGE" "$output"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Evaluate Nix flake without builds
        run: nix flake check --no-build --no-write-lock-file --option allow-import-from-derivation false
