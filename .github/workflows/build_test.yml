name: Test Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ proton-cachyos, proton-cachyos-v3 ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build package
        run: nix build .#${{ matrix.package }}

      - name: Verify package structure
        run: |
          set -euo pipefail
          tool=result/share/steam/compatibilitytools.d/proton-cachyos-slr

          test -f "$tool/compatibilitytool.vdf"
          test -x "$tool/proton"

          grep -q '"proton-cachyos-slr"' "$tool/compatibilitytool.vdf"
          grep -q '"display_name" "Proton-CachyOS-' "$tool/compatibilitytool.vdf"

          ! test -e "$tool/files/share/default_pfx/.update-timestamp"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check Nix flake
        run: nix flake check
