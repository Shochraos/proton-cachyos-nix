name: Update Package Version

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Updates
        id: check
        run: |
          set -e
          # Store current version info
          OLD_CONTENT=$(cat versions.json)

          # Get latest version (epoch is now variable, not hardcoded to 1)
          LATEST=$(curl -fsSL 'https://mirror.cachyos.org/repo/x86_64/cachyos/' | grep -Po 'proton-cachyos-slr-\d+:.*?-x86_64\.pkg\.tar\.zst' | sort -V | tail -n1)
          if [[ -z "$LATEST" ]]; then
            echo "ERROR: No matching package name found in remote directory listing." >&2
            exit 1
          fi
          ENCODED_LATEST=${LATEST//:/%3A}

          EPOCH=$(echo $LATEST | grep -Po '(?<=proton-cachyos-slr-)\d+(?=:)')
          BASE=$(echo $LATEST | grep -Po '(?<=:)\d+\.\d+(?=\.)')
          RELEASE=$(echo $LATEST | grep -Po '\d+(?=-\d+-x86_64)')

          # Download file to temporary location
          TEMP_FILE=$(mktemp)
          if ! curl -Lf "https://mirror.cachyos.org/repo/x86_64/cachyos/${ENCODED_LATEST}" -o "$TEMP_FILE"; then
            echo "ERROR: Download failed for $ENCODED_LATEST" >&2
            exit 1
          fi

          # Get hash of the downloaded file
          HASH=$(nix hash file --base64 --type sha256 "$TEMP_FILE")
          rm "$TEMP_FILE"

          # Debug Variables
          echo "LATEST: $LATEST"
          echo "ENCODED_LATEST: $ENCODED_LATEST"
          echo "EPOCH: $EPOCH"
          echo "BASE: $BASE"
          echo "RELEASE: $RELEASE"
          echo "HASH: $HASH"

          # Create new versions.json content
          NEW_CONTENT=$(cat <<EOF
          {
            "epoch": "$EPOCH",
            "base": "$BASE",
            "release": "$RELEASE",
            "hash": "sha256-$HASH"
          }
          EOF
          )

          # Compare old and new content
          if [ "$OLD_CONTENT" = "$NEW_CONTENT" ]; then
            echo "No updates available"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "$NEW_CONTENT" > versions.json
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Commit and push to main
        if: env.UPDATE_NEEDED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "proton-cachyos: update to latest version"
          git push origin main
