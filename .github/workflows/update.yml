name: Update Package Version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Updates
        id: check
        run: |
          set -euo pipefail

          TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/CachyOS/proton-cachyos/releases/latest | jq -r .tag_name)

          if [[ ! "$TAG" =~ ^cachyos-(.+)-slr$ ]]; then
            echo "ERROR: unexpected release tag '$TAG'" >&2
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"
          BASE="${VERSION%%-*}"
          RELEASE="${VERSION#*-}"

          declare -A HASHES
          for ARCH in x86_64 x86_64_v3; do
            ASSET="proton-cachyos-${VERSION}-slr-${ARCH}"
            SUM=$(curl -fsSL "https://github.com/CachyOS/proton-cachyos/releases/download/${TAG}/${ASSET}.sha512sum")
            SUM=${SUM%% *}
            if [[ ! "$SUM" =~ ^[0-9a-f]{128}$ ]]; then
              echo "ERROR: no valid sha512sum published for $ARCH in $TAG" >&2
              exit 1
            fi
            HASHES[$ARCH]=$(nix hash convert --hash-algo sha512 --to sri "$SUM")
          done

          echo "TAG: $TAG"
          echo "BASE: $BASE"
          echo "RELEASE: $RELEASE"
          echo "x86_64: ${HASHES[x86_64]}"
          echo "x86_64_v3: ${HASHES[x86_64_v3]}"

          NEW_CONTENT=$(jq -n \
            --arg base "$BASE" --arg release "$RELEASE" \
            --arg baseline "${HASHES[x86_64]}" --arg v3 "${HASHES[x86_64_v3]}" \
            '{base: $base, release: $release, hashes: {"x86_64": $baseline, "x86_64_v3": $v3}}')

          if [ "$(jq -S . versions.json)" = "$(echo "$NEW_CONTENT" | jq -S .)" ]; then
            echo "No updates available"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "$NEW_CONTENT" > versions.json
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Commit and push to main
        if: env.UPDATE_NEEDED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "proton-cachyos: update to latest version"
          git push origin main
