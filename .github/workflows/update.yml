name: Update Package Version

on:
  schedule:
    - cron: '0 0 * * *'  # Run every day at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for Updates
        id: check
        run: |
          set -e
          OLD_CONTENT=$(cat versions.json)

          LATEST=$(curl -fsSL 'https://mirror.cachyos.org/repo/x86_64/cachyos/' | grep -Po 'proton-cachyos-slr-\d+:[0-9.]+-\d+-x86_64\.pkg\.tar\.zst' | sort -V | tail -n1)
          if [[ -z "$LATEST" ]]; then
            echo "ERROR: No matching package found in directory listing." >&2
            exit 1
          fi

          # URL-encode the ':' in the epoch separator  ← das fehlte!
          ENCODED_LATEST=${LATEST//:/%3A}
          if [[ -z "$ENCODED_LATEST" ]]; then
            echo "ERROR: ENCODED_LATEST is empty" >&2
            exit 1
          fi

          EPOCH=$(echo "$LATEST"   | grep -Po '(?<=proton-cachyos-slr-)\d+(?=:)')
          BASE=$(echo "$LATEST"    | grep -Po '(?<=:)\d+\.\d+(?=\.)')
          RELEASE=$(echo "$LATEST" | grep -Po '(?<=\d\.)\d+(?=-\d+-x86_64)')
          PKGREL=$(echo "$LATEST"  | grep -Po '(?<=-)\d+(?=-x86_64)')

          # Download to temp file
          TEMP_FILE=$(mktemp)
          if ! curl -Lf "https://mirror.cachyos.org/repo/x86_64/cachyos/${ENCODED_LATEST}" -o "$TEMP_FILE"; then
            echo "ERROR: Download failed for $ENCODED_LATEST" >&2
            exit 1
          fi

          # Sanity check: the real package is hundreds of MB, abort if too small
          SIZE=$(stat -c%s "$TEMP_FILE")
          if [[ "$SIZE" -lt 10000000 ]]; then
            echo "ERROR: downloaded file too small ($SIZE bytes) — wrong URL?" >&2
            exit 1
          fi

          HASH=$(nix hash file --base64 --type sha256 "$TEMP_FILE")
          rm "$TEMP_FILE"

          # Debug
          echo "LATEST: $LATEST"
          echo "ENCODED_LATEST: $ENCODED_LATEST"
          echo "EPOCH: $EPOCH"
          echo "BASE: $BASE"
          echo "RELEASE: $RELEASE"
          echo "PKGREL: $PKGREL"
          echo "SIZE: $SIZE"
          echo "HASH: $HASH"

          # Build new versions.json deterministically with jq
          NEW_CONTENT=$(jq -n \
            --arg epoch "$EPOCH" --arg base "$BASE" --arg release "$RELEASE" \
            --arg pkgrel "$PKGREL" --arg hash "sha256-$HASH" \
            '{epoch:$epoch, base:$base, release:$release, pkgrel:$pkgrel, hash:$hash}')

          if [ "$(jq -S . versions.json)" = "$(echo "$NEW_CONTENT" | jq -S .)" ]; then
            echo "No updates available"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          else
            echo "$NEW_CONTENT" > versions.json
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          fi

      - name: Commit and push to main
        if: env.UPDATE_NEEDED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "proton-cachyos: update to latest version"
          git push origin main
