name: Bug Report
description: File a bug report
body:
  - type: dropdown
    id: package
    attributes:
      label: Package and variant
      options:
        - proton-cachyos (x86_64 baseline)
        - proton-cachyos-v3 (x86_64_v3)
        - dw-proton
    validations:
      required: true
  - type: input
    id: upstream-version
    attributes:
      label: Upstream version
      description: Report the base and release from the provider's versions.json, and the flake revision if known.
      placeholder: "major.minor-release"
    validations:
      required: true
  - type: input
    id: nixos-version
    attributes:
      label: NixOS or host distribution version
      description: What operating system version are you running?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include reproduction steps and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Remove credentials and personal information before posting.
      render: shell
